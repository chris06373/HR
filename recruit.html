<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recruitment Portal</title>
  <style>
    :root {
      --bg: #f1f5f9;
      --surface: #ffffff;
      --surface-alt: #f8fafc;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --accent-bg: #eff6ff;
      --success: #059669;
      --warning: #d97706;
      --shadow: 0 1px 3px rgba(15, 23, 42, 0.08), 0 1px 2px rgba(15, 23, 42, 0.04);
      --radius: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .brand h1 {
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .brand p {
      font-size: 0.82rem;
      color: var(--muted);
    }

    .header-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    button, select, input, a.btn {
      font-family: inherit;
      font-size: 0.875rem;
      text-decoration: none;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn:hover {
      background: var(--surface-alt);
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-reset {
      color: #b45309;
      background: #fffbeb;
      border-color: #fde68a;
    }

    .btn-reset:hover {
      background: #fef3c7;
    }

    main {
      max-width: 1440px;
      margin: 0 auto;
      padding: 20px 24px 48px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* Filter Bar */
    .filter-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 14px;
      align-items: end;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field label {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .field input, .field select {
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface-alt);
      color: var(--text);
    }

    .field input:focus, .field select:focus {
      outline: none;
      border-color: var(--primary);
      background: var(--surface);
    }

    .filter-summary {
      font-size: 0.82rem;
      color: var(--muted);
      padding-bottom: 8px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .section-header h2 {
      font-size: 1.05rem;
      font-weight: 700;
    }

    /* Kanban Board */
    .kanban-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(240px, 1fr));
      gap: 14px;
      overflow-x: auto;
      padding-bottom: 6px;
    }

    .kanban-col {
      background: #e2e8f0;
      border-radius: var(--radius);
      padding: 12px;
      min-height: 360px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: background 0.15s ease;
    }

    .kanban-col.drag-over {
      background: #dbeafe;
      outline: 2px dashed var(--primary);
    }

    .col-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 700;
      font-size: 0.88rem;
      padding: 2px 4px;
    }

    .col-count {
      background: var(--surface);
      color: var(--text);
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 600;
    }

    .empty-col {
      font-size: 0.78rem;
      color: var(--muted);
      text-align: center;
      padding: 24px 8px;
      border: 1px dashed #cbd5e1;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.45);
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      box-shadow: var(--shadow);
      cursor: grab;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .card:active {
      cursor: grabbing;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .card-name {
      font-weight: 700;
      font-size: 0.92rem;
    }

    .card-role {
      font-size: 0.8rem;
      color: var(--primary);
      font-weight: 500;
    }

    .badge {
      display: inline-block;
      font-size: 0.72rem;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--accent-bg);
      color: var(--primary);
      font-weight: 600;
      width: fit-content;
    }

    .badge-time {
      background: #f1f5f9;
      color: #334155;
    }

    .card-meta {
      font-size: 0.78rem;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .schedule-tag {
      font-size: 0.75rem;
      background: #ecfdf5;
      color: var(--success);
      border: 1px solid #a7f3d0;
      padding: 4px 8px;
      border-radius: 6px;
      font-weight: 500;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      padding-top: 6px;
      border-top: 1px solid var(--border);
    }

    .stage-select {
      font-size: 0.75rem;
      padding: 4px 6px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface-alt);
    }

    .btn-sm {
      padding: 4px 8px;
      font-size: 0.75rem;
      border-radius: 6px;
    }

    /* Calendar & Scheduling */
    .schedule-layout {
      display: grid;
      grid-template-columns: 1.35fr 1fr;
      gap: 18px;
    }

    @media (max-width: 960px) {
      .schedule-layout {
        grid-template-columns: 1fr;
      }
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow);
    }

    .cal-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .cal-title {
      font-weight: 700;
      font-size: 0.98rem;
    }

    .cal-weekdays, .cal-days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      text-align: center;
    }

    .cal-weekdays div {
      font-size: 0.74rem;
      font-weight: 700;
      color: var(--muted);
      padding-bottom: 6px;
    }

    .cal-day {
      min-height: 68px;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px;
      text-align: left;
      background: var(--surface-alt);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 4px;
      transition: border-color 0.15s ease;
    }

    .cal-day:hover {
      border-color: var(--primary);
    }

    .cal-day.empty {
      background: transparent;
      border-color: transparent;
      cursor: default;
    }

    .cal-day.selected {
      background: var(--accent-bg);
      border-color: var(--primary);
      outline: 1px solid var(--primary);
    }

    .day-num {
      font-size: 0.78rem;
      font-weight: 700;
    }

    .event-dot {
      font-size: 0.68rem;
      background: var(--primary);
      color: #fff;
      padding: 1px 5px;
      border-radius: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .form-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 18px;
    }

    .agenda-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 260px;
      overflow-y: auto;
    }

    .agenda-item {
      border: 1px solid var(--border);
      background: var(--surface-alt);
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      font-size: 0.84rem;
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 20px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 20px 25px -5px rgba(15, 23, 42, 0.2);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 6px;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--text);
      color: #fff;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 0.84rem;
      opacity: 0;
      transform: translateY(8px);
      transition: all 0.2s ease;
      pointer-events: none;
      z-index: 60;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <h1>Recruitment Board</h1>
    </div>
    <div class="header-actions">
      <a href="index.html" class="btn">Home</a>
      <button class="btn btn-primary" id="btnOpenAddCandidate">+ Tambah Kandidat</button>
      <button class="btn btn-reset" id="btnClearStorage">Clear Storage</button>
    </div>
  </header>

  <main>
    <!-- Penyaring Kandidat -->
    <section aria-label="Penyaring Kandidat">
      <div class="filter-panel">
        <div class="field">
          <label for="filterSearch">Cari Nama / Posisi</label>
          <input type="text" id="filterSearch" placeholder="Cari nama atau posisi..." />
        </div>
        <div class="field">
          <label for="filterMaxSalary">Maks. Ekspektasi Gaji (Rp)</label>
          <select id="filterMaxSalary">
            <option value="">Semua Gaji</option>
            <option value="8000000">Hingga Rp 8.000.000</option>
            <option value="12000000">Hingga Rp 12.000.000</option>
            <option value="18000000">Hingga Rp 18.000.000</option>
            <option value="25000000">Hingga Rp 25.000.000</option>
          </select>
        </div>
        <div class="field">
          <label for="filterAvailability">Ketersediaan Waktu</label>
          <select id="filterAvailability">
            <option value="">Semua Ketersediaan</option>
            <option value="Langsung (Immediate)">Langsung (Immediate)</option>
            <option value="2 Minggu">2 Minggu</option>
            <option value="1 Bulan">1 Bulan</option>
          </select>
        </div>
        <div class="filter-summary" id="filterSummary">Menampilkan 0 kandidat</div>
      </div>
    </section>

    <!-- Kanban Board -->
    <section aria-label="Kanban Board Rekrutmen">
      <div class="section-header">
        <h2>Pipeline Rekrutmen (Kanban Board)</h2>
      </div>
      <div class="kanban-grid" id="kanbanBoard"></div>
    </section>

    <!-- Kalender dan Penjadwalan -->
    <section aria-label="Kalender dan Penjadwalan">
      <div class="section-header">
        <h2>Kalender &amp; Penjadwalan Wawancara</h2>
      </div>
      <div class="schedule-layout">
        <div class="panel">
          <div class="cal-top">
            <button class="btn btn-sm" id="prevMonth">&lsaquo; Bulan Lalu</button>
            <div class="cal-title" id="calMonthTitle"></div>
            <button class="btn btn-sm" id="nextMonth">Bulan Depan &rsaquo;</button>
          </div>
          <div class="cal-weekdays">
            <div>Min</div><div>Sen</div><div>Sel</div><div>Rab</div><div>Kam</div><div>Jum</div><div>Sab</div>
          </div>
          <div class="cal-days" id="calDays"></div>
        </div>

        <div class="panel">
          <h3 style="font-size: 0.95rem; margin-bottom: 12px;">Atur Jadwal Wawancara</h3>
          <form class="form-grid" id="scheduleForm">
            <div class="field">
              <label for="schedCandidate">Pilih Kandidat</label>
              <select id="schedCandidate" required></select>
            </div>
            <div class="field">
              <label for="schedDate">Tanggal</label>
              <input type="date" id="schedDate" required />
            </div>
            <div class="field">
              <label for="schedTime">Jam</label>
              <input type="time" id="schedTime" value="10:00" required />
            </div>
            <div class="field">
              <label for="schedNote">Catatan / Pewawancara</label>
              <input type="text" id="schedNote" placeholder="Catatan atau nama pewawancara" />
            </div>
            <button type="submit" class="btn btn-primary">Simpan Jadwal</button>
          </form>

          <h3 style="font-size: 0.9rem; margin-bottom: 8px; color: var(--muted);">
            Jadwal pada Tanggal Terpilih (<span id="selectedDateLabel">-</span>)
          </h3>
          <div class="agenda-list" id="agendaList"></div>
        </div>
      </div>
    </section>
  </main>

  <!-- Modal Tambah Kandidat (Tanpa Fitur Hapus) -->
  <div class="modal-backdrop" id="addModal">
    <div class="modal">
      <h3 style="font-size: 1rem;">Tambah Kandidat Baru</h3>
      <form class="form-grid" id="addCandidateForm" style="margin-bottom: 0;">
        <div class="field">
          <label for="candName">Nama Lengkap</label>
          <input type="text" id="candName" required placeholder="Nama lengkap kandidat" />
        </div>
        <div class="field">
          <label for="candRole">Posisi Dilamar</label>
          <input type="text" id="candRole" required placeholder="Posisi yang dilamar" />
        </div>
        <div class="field">
          <label for="candSalary">Ekspektasi Gaji (Rp / bulan)</label>
          <input type="number" id="candSalary" required min="1000000" step="500000" value="10000000" />
        </div>
        <div class="field">
          <label for="candAvailability">Ketersediaan Waktu</label>
          <select id="candAvailability" required>
            <option value="Langsung (Immediate)">Langsung (Immediate)</option>
            <option value="2 Minggu">2 Minggu</option>
            <option value="1 Bulan">1 Bulan</option>
          </select>
        </div>
        <div class="field">
          <label for="candStage">Tahap Awal</label>
          <select id="candStage">
            <option value="Applied">Applied</option>
            <option value="Screening">Screening</option>
            <option value="Interview">Interview</option>
            <option value="Offering">Offering</option>
            <option value="Hired">Hired</option>
          </select>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn" id="btnCancelModal">Batal</button>
          <button type="submit" class="btn btn-primary">Simpan Kandidat</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const STORAGE_KEY = "recruitment_hub_data_v1";
    const STAGES = ["Applied", "Screening", "Interview", "Offering", "Hired"];

    const todayObj = new Date();
    const pad = (n) => String(n).padStart(2, "0");
    const toDateStr = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;

    const DEFAULT_DATA = {
      candidates: [],
      schedules: []
    };

    let state = loadState();
    let calYear = todayObj.getFullYear();
    let calMonth = todayObj.getMonth();
    let selectedDate = toDateStr(todayObj);

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return structuredClone(DEFAULT_DATA);
        const parsed = JSON.parse(raw);
        return {
          candidates: Array.isArray(parsed.candidates) ? parsed.candidates : [],
          schedules: Array.isArray(parsed.schedules) ? parsed.schedules : []
        };
      } catch {
        return structuredClone(DEFAULT_DATA);
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function showToast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      setTimeout(() => el.classList.remove("show"), 2200);
    }

    function formatRupiah(num) {
      return "Rp " + Number(num).toLocaleString("id-ID");
    }

    function getFilteredCandidates() {
      const q = document.getElementById("filterSearch").value.trim().toLowerCase();
      const maxSal = Number(document.getElementById("filterMaxSalary").value || 0);
      const avail = document.getElementById("filterAvailability").value;

      return state.candidates.filter((c) => {
        const matchText = !q || c.name.toLowerCase().includes(q) || c.role.toLowerCase().includes(q);
        const matchSal = !maxSal || c.salary <= maxSal;
        const matchAvail = !avail || c.availability === avail;
        return matchText && matchSal && matchAvail;
      });
    }

    function renderAll() {
      renderKanban();
      renderCalendar();
      renderCandidateSelect();
      renderAgenda();
    }

    function renderKanban() {
      const board = document.getElementById("kanbanBoard");
      const filtered = getFilteredCandidates();
      document.getElementById("filterSummary").textContent =
        `Menampilkan ${filtered.length} dari ${state.candidates.length} kandidat`;

      board.innerHTML = "";

      STAGES.forEach((stage) => {
        const items = filtered.filter((c) => c.stage === stage);
        const col = document.createElement("div");
        col.className = "kanban-col";
        col.dataset.stage = stage;

        col.addEventListener("dragover", (e) => {
          e.preventDefault();
          col.classList.add("drag-over");
        });

        col.addEventListener("dragleave", () => col.classList.remove("drag-over"));

        col.addEventListener("drop", (e) => {
          e.preventDefault();
          col.classList.remove("drag-over");
          const id = e.dataTransfer.getData("text/plain");
          moveCandidateStage(id, stage);
        });

        const header = document.createElement("div");
        header.className = "col-header";
        header.innerHTML = `<span>${stage}</span><span class="col-count">${items.length}</span>`;
        col.appendChild(header);

        if (!items.length) {
          const emptyEl = document.createElement("div");
          emptyEl.className = "empty-col";
          emptyEl.textContent = "Belum ada kandidat";
          col.appendChild(emptyEl);
        }

        items.forEach((c) => {
          const sched = state.schedules.find((s) => s.candidateId === c.id);
          const card = document.createElement("div");
          card.className = "card";
          card.draggable = true;
          card.dataset.id = c.id;

          card.addEventListener("dragstart", (e) => {
            e.dataTransfer.setData("text/plain", c.id);
          });

          const stageOptions = STAGES.map(
            (st) => `<option value="${st}" ${st === c.stage ? "selected" : ""}>${st}</option>`
          ).join("");

          card.innerHTML = `
            <div class="card-top">
              <div>
                <div class="card-name">${escapeHtml(c.name)}</div>
                <div class="card-role">${escapeHtml(c.role)}</div>
              </div>
            </div>
            <div class="card-meta">
              <span>Gaji: <strong>${formatRupiah(c.salary)}</strong></span>
              <span class="badge badge-time">Siap: ${escapeHtml(c.availability)}</span>
            </div>
            ${sched ? `<div class="schedule-tag">Jadwal: ${sched.date} ${sched.time}</div>` : ""}
            <div class="card-footer">
              <select class="stage-select" aria-label="Pindah tahap ${escapeHtml(c.name)}">${stageOptions}</select>
              <button type="button" class="btn btn-sm btn-schedule">Jadwalkan</button>
            </div>
          `;

          card.querySelector(".stage-select").addEventListener("change", (e) => {
            moveCandidateStage(c.id, e.target.value);
          });

          card.querySelector(".btn-schedule").addEventListener("click", () => {
            document.getElementById("schedCandidate").value = c.id;
            document.getElementById("schedDate").value = selectedDate;
            document.getElementById("schedCandidate").scrollIntoView({ behavior: "smooth", block: "center" });
          });

          col.appendChild(card);
        });

        board.appendChild(col);
      });
    }

    function moveCandidateStage(id, newStage) {
      const cand = state.candidates.find((c) => c.id === id);
      if (!cand || cand.stage === newStage) return;
      cand.stage = newStage;
      saveState();
      renderKanban();
      showToast(`${cand.name} dipindahkan ke ${newStage}`);
    }

    function renderCalendar() {
      const titleEl = document.getElementById("calMonthTitle");
      const daysEl = document.getElementById("calDays");
      const monthNames = [
        "Januari", "Februari", "Maret", "April", "Mei", "Juni",
        "Juli", "Agustus", "September", "Oktober", "November", "Desember"
      ];

      titleEl.textContent = `${monthNames[calMonth]} ${calYear}`;
      daysEl.innerHTML = "";

      const firstDay = new Date(calYear, calMonth, 1).getDay();
      const totalDays = new Date(calYear, calMonth + 1, 0).getDate();

      for (let i = 0; i < firstDay; i++) {
        const empty = document.createElement("div");
        empty.className = "cal-day empty";
        daysEl.appendChild(empty);
      }

      for (let day = 1; day <= totalDays; day++) {
        const dateStr = `${calYear}-${pad(calMonth + 1)}-${pad(day)}`;
        const daySchedules = state.schedules.filter((s) => s.date === dateStr);

        const cell = document.createElement("div");
        cell.className = "cal-day" + (dateStr === selectedDate ? " selected" : "");
        cell.innerHTML = `<div class="day-num">${day}</div>`;

        daySchedules.slice(0, 2).forEach((s) => {
          const cand = state.candidates.find((c) => c.id === s.candidateId);
          const dot = document.createElement("div");
          dot.className = "event-dot";
          dot.textContent = `${s.time} ${cand ? cand.name : "Kandidat"}`;
          cell.appendChild(dot);
        });

        if (daySchedules.length > 2) {
          const more = document.createElement("div");
          more.style.fontSize = "0.68rem";
          more.style.color = "var(--muted)";
          more.textContent = `+${daySchedules.length - 2} lagi`;
          cell.appendChild(more);
        }

        cell.addEventListener("click", () => {
          selectedDate = dateStr;
          document.getElementById("schedDate").value = dateStr;
          renderCalendar();
          renderAgenda();
        });

        daysEl.appendChild(cell);
      }
    }

    function renderCandidateSelect() {
      const sel = document.getElementById("schedCandidate");
      const submitBtn = document.querySelector("#scheduleForm button[type='submit']");
      const currentVal = sel.value;

      if (!state.candidates.length) {
        sel.innerHTML = `<option value="">-- Belum ada kandidat --</option>`;
        sel.disabled = true;
        submitBtn.disabled = true;
        return;
      }

      sel.disabled = false;
      submitBtn.disabled = false;
      sel.innerHTML = state.candidates
        .map((c) => `<option value="${c.id}">${escapeHtml(c.name)} — ${escapeHtml(c.role)}</option>`)
        .join("");

      if (currentVal && state.candidates.some((c) => c.id === currentVal)) {
        sel.value = currentVal;
      }
    }

    function renderAgenda() {
      document.getElementById("selectedDateLabel").textContent = selectedDate;
      const list = document.getElementById("agendaList");
      const items = state.schedules
        .filter((s) => s.date === selectedDate)
        .sort((a, b) => a.time.localeCompare(b.time));

      if (!items.length) {
        list.innerHTML = `<div style="font-size:0.82rem; color:var(--muted);">Belum ada jadwal wawancara pada tanggal ini.</div>`;
        return;
      }

      list.innerHTML = items
        .map((s) => {
          const cand = state.candidates.find((c) => c.id === s.candidateId);
          return `
            <div class="agenda-item">
              <div>
                <strong>${s.time}</strong> &bull; <strong>${cand ? escapeHtml(cand.name) : "Kandidat"}</strong>
                <div style="font-size:0.76rem; color:var(--muted);">
                  ${cand ? escapeHtml(cand.role) : ""}${s.note ? " — " + escapeHtml(s.note) : ""}
                </div>
              </div>
              <span class="badge">${cand ? cand.stage : ""}</span>
            </div>
          `;
        })
        .join("");
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    // Event Listeners
    ["filterSearch", "filterMaxSalary", "filterAvailability"].forEach((id) => {
      document.getElementById(id).addEventListener("input", renderKanban);
      document.getElementById(id).addEventListener("change", renderKanban);
    });

    document.getElementById("prevMonth").addEventListener("click", () => {
      calMonth--;
      if (calMonth < 0) {
        calMonth = 11;
        calYear--;
      }
      renderCalendar();
    });

    document.getElementById("nextMonth").addEventListener("click", () => {
      calMonth++;
      if (calMonth > 11) {
        calMonth = 0;
        calYear++;
      }
      renderCalendar();
    });

    document.getElementById("schedDate").value = selectedDate;

    document.getElementById("scheduleForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const candidateId = document.getElementById("schedCandidate").value;
      const date = document.getElementById("schedDate").value;
      const time = document.getElementById("schedTime").value;
      const note = document.getElementById("schedNote").value.trim();

      if (!candidateId || !date || !time) return;

      state.schedules.push({
        id: "s-" + Date.now(),
        candidateId,
        date,
        time,
        note
      });

      selectedDate = date;
      const [y, m] = date.split("-").map(Number);
      calYear = y;
      calMonth = m - 1;

      saveState();
      document.getElementById("schedNote").value = "";
      renderAll();
      showToast("Jadwal wawancara tersimpan");
    });

    const modal = document.getElementById("addModal");
    document.getElementById("btnOpenAddCandidate").addEventListener("click", () => modal.classList.add("open"));
    document.getElementById("btnCancelModal").addEventListener("click", () => modal.classList.remove("open"));
    modal.addEventListener("click", (e) => {
      if (e.target === modal) modal.classList.remove("open");
    });

    document.getElementById("addCandidateForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const name = document.getElementById("candName").value.trim();
      const role = document.getElementById("candRole").value.trim();
      const salary = Number(document.getElementById("candSalary").value);
      const availability = document.getElementById("candAvailability").value;
      const stage = document.getElementById("candStage").value;

      state.candidates.push({
        id: "c-" + Date.now(),
        name,
        role,
        salary,
        availability,
        stage
      });

      saveState();
      e.target.reset();
      document.getElementById("candSalary").value = "10000000";
      modal.classList.remove("open");
      renderAll();
      showToast(`Kandidat ${name} ditambahkan`);
    });

    document.getElementById("btnClearStorage").addEventListener("click", () => {
      localStorage.removeItem(STORAGE_KEY);
      state = structuredClone(DEFAULT_DATA);
      saveState();
      renderAll();
      showToast("Storage dibersihkan");
    });

    renderAll();
  </script>
</body>
</html>
