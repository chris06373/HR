<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>e-Sign Workspace</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <style>
    body {
      background-color: #f4f6f9;
      font-size: 0.95rem;
    }

    .sig-canvas {
      width: 100%;
      height: 155px;
      border: 2px dashed #adb5bd;
      border-radius: 0.5rem;
      background-color: #ffffff;
      touch-action: none;
      cursor: crosshair;
    }

    .doc-paper {
      background: #ffffff;
      border: 1px solid #dee2e6;
      border-radius: 0.5rem;
      padding: 1.25rem;
    }

    .sig-box-preview {
      border: 1px solid #ced4da;
      border-radius: 0.375rem;
      padding: 0.4rem;
      min-height: 76px;
      background: #fafafa;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .sig-box-preview img {
      max-height: 52px;
      max-width: 100%;
    }

    #areaCetakKhusus {
      display: none;
    }

    @media print {
      @page {
        size: A4 portrait;
        margin: 10mm;
      }

      body * {
        visibility: hidden !important;
      }

      #areaCetakKhusus,
      #areaCetakKhusus * {
        visibility: visible !important;
      }

      #areaCetakKhusus {
        display: block !important;
        position: fixed !important;
        left: 0 !important;
        top: 0 !important;
        width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
        background: #ffffff !important;
      }

      .doc-paper {
        border: 1px solid #ccc !important;
        border-radius: 0 !important;
        padding: 12px !important;
        page-break-inside: avoid !important;
        break-inside: avoid !important;
        max-height: 270mm;
        overflow: hidden;
      }
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-dark sticky-top shadow-sm">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="#">
        <i class="bi bi-vector-pen me-2 text-warning"></i>e-Sign Suite
      </a>
    </div>
  </nav>

  <!-- Kontainer 1 Halaman -->
  <main class="container py-3 py-md-4">

    <!-- Tab Navigasi -->
    <ul class="nav nav-tabs nav-fill mb-3 bg-white rounded-top shadow-sm pt-1 px-1" id="mainTabs" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active fw-semibold" id="tab-template-btn" data-bs-toggle="tab" data-bs-target="#tab-template" type="button" role="tab">
          <i class="bi bi-file-earmark-text me-1"></i>1. Template Surat
        </button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link fw-semibold" id="tab-ttd-btn" data-bs-toggle="tab" data-bs-target="#tab-ttd" type="button" role="tab">
          <i class="bi bi-pen me-1"></i>2. Buat &amp; TTD
        </button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link fw-semibold" id="tab-histori-btn" data-bs-toggle="tab" data-bs-target="#tab-histori" type="button" role="tab">
          <i class="bi bi-clock-history me-1"></i>3. Histori Arsip
        </button>
      </li>
    </ul>

    <div class="tab-content" id="mainTabsContent">

      <!-- ==================== TAB 1: TEMPLATE SURAT (DEFAULT KOSONG) ==================== -->
      <div class="tab-pane fade show active" id="tab-template" role="tabpanel">
        <div class="row g-3">
          <div class="col-12 col-lg-5">
            <div class="card shadow-sm border-0">
              <div class="card-header bg-white fw-bold">
                <i class="bi bi-sliders me-1 text-primary"></i>Modifikasi Template Surat
              </div>
              <div class="card-body">
                <div class="mb-2">
                  <label class="form-label small fw-semibold">Jenis Template</label>
                  <select class="form-select form-select-sm" id="jenisTemplate" onchange="perbaruiNomorTemplateOtomatis(); renderTemplate();">
                    <option value="PO">Surat Purchase Order (PO)</option>
                    <option value="Invoice">Surat Tagihan (Invoice)</option>
                    <option value="PKWT">Surat Perjanjian Kerja Karyawan</option>
                  </select>
                </div>

                <div class="mb-2">
                  <label class="form-label small fw-semibold">Nomor Dokumen (Otomatis)</label>
                  <input type="text" class="form-control form-control-sm" id="tplNomor" oninput="renderTemplate()" />
                </div>

                <div class="mb-2">
                  <label class="form-label small fw-semibold">Pihak Pertama (Perusahaan / Pembuat)</label>
                  <input type="text" class="form-control form-control-sm" id="tplPerusahaan" oninput="renderTemplate()" />
                </div>

                <div class="mb-2">
                  <label class="form-label small fw-semibold">Pihak Kedua (Vendor / Klien / Karyawan)</label>
                  <input type="text" class="form-control form-control-sm" id="tplPihakKedua" oninput="renderTemplate()" />
                </div>

                <div class="mb-2">
                  <label class="form-label small fw-semibold">Rincian Utama</label>
                  <input type="text" class="form-control form-control-sm" id="tplDetail" oninput="renderTemplate()" />
                </div>

                <div class="mb-3">
                  <label class="form-label small fw-semibold">Isi / Klausul Tambahan</label>
                  <textarea class="form-control form-control-sm" id="tplCatatan" rows="3" oninput="renderTemplate()"></textarea>
                </div>

                <div class="d-grid gap-2">
                  <button type="button" class="btn btn-primary btn-sm" onclick="panggilTemplateKeTTD()">
                    <i class="bi bi-box-arrow-in-right me-1"></i>Panggil ke Buat &amp; TTD
                  </button>
                  <div class="btn-group" role="group">
                    <button type="button" class="btn btn-outline-dark btn-sm" onclick="cetakDokumenTerpilih(buatHTMLTemplate())">
                      <i class="bi bi-printer me-1"></i>Print (1 Hal)
                    </button>
                    <button type="button" class="btn btn-outline-success btn-sm" onclick="bagikanTemplate()">
                      <i class="bi bi-share me-1"></i>Bagikan
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="col-12 col-lg-7">
            <div class="doc-paper shadow-sm" id="areaPreviewSurat"></div>
          </div>
        </div>
      </div>

      <!-- ==================== TAB 2: BUAT & TTD (WAJIB 2 TTD) ==================== -->
      <div class="tab-pane fade" id="tab-ttd" role="tabpanel">
        <div class="card shadow-sm border-0">
          <div class="card-header bg-white fw-bold">
            <i class="bi bi-pencil-square me-1 text-primary"></i>Form Dokumen &amp; Dua Tanda Tangan (Wajib Keduanya)
          </div>
          <div class="card-body">
            <form id="formTTD" onsubmit="simpanDokumenTTD(event)">
              <div class="row g-2 mb-2">
                <div class="col-12 col-sm-4">
                  <label class="form-label small fw-semibold">Kategori</label>
                  <select class="form-select form-select-sm" id="docKategori" onchange="perbaruiNomorDokumenOtomatis()">
                    <option value="PO">Purchase Order (PO)</option>
                    <option value="Invoice">Invoice</option>
                    <option value="PKWT">Surat Perjanjian Kerja</option>
                  </select>
                </div>
                <div class="col-12 col-sm-8">
                  <label class="form-label small fw-semibold">Nomor Dokumen (Otomatis)</label>
                  <input type="text" class="form-control form-control-sm" id="docNomor" required />
                </div>
              </div>

              <div class="row g-2 mb-2">
                <div class="col-12 col-sm-6">
                  <label class="form-label small fw-semibold">Nama Pihak Pertama</label>
                  <input type="text" class="form-control form-control-sm" id="docPihakPertama" required />
                </div>
                <div class="col-12 col-sm-6">
                  <label class="form-label small fw-semibold">Nama Pihak Kedua</label>
                  <input type="text" class="form-control form-control-sm" id="docPihakKedua" required />
                </div>
              </div>

              <div class="mb-2">
                <label class="form-label small fw-semibold">Rincian Utama</label>
                <input type="text" class="form-control form-control-sm" id="docDetail" />
              </div>

              <div class="mb-3">
                <label class="form-label small fw-semibold">Catatan / Klausul</label>
                <textarea class="form-control form-control-sm" id="docCatatan" rows="2"></textarea>
              </div>

              <!-- Dua Kanvas Tanda Tangan Wajib -->
              <div class="row g-3 mb-3">
                <div class="col-12 col-md-6">
                  <div class="d-flex justify-content-between align-items-center mb-1">
                    <label class="form-label small fw-semibold mb-0">TTD Pihak Pertama (Wajib)</label>
                    <button type="button" class="btn btn-sm btn-outline-danger py-0" onclick="bersihkanKanvas('pihak1')">
                      <i class="bi bi-eraser me-1"></i>Hapus
                    </button>
                  </div>
                  <canvas id="canvasPihak1" class="sig-canvas"></canvas>
                </div>

                <div class="col-12 col-md-6">
                  <div class="d-flex justify-content-between align-items-center mb-1">
                    <label class="form-label small fw-semibold mb-0">TTD Pihak Kedua (Wajib)</label>
                    <button type="button" class="btn btn-sm btn-outline-danger py-0" onclick="bersihkanKanvas('pihak2')">
                      <i class="bi bi-eraser me-1"></i>Hapus
                    </button>
                  </div>
                  <canvas id="canvasPihak2" class="sig-canvas"></canvas>
                </div>
              </div>

              <div class="d-grid gap-2 d-sm-flex justify-content-sm-end">
                <button type="submit" class="btn btn-primary btn-sm px-3">
                  <i class="bi bi-check2-circle me-1"></i>Simpan ke Histori
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <!-- ==================== TAB 3: HISTORI ARSIP ==================== -->
      <div class="tab-pane fade" id="tab-histori" role="tabpanel">
        <div class="card shadow-sm border-0">
          <div class="card-header bg-white d-flex flex-wrap justify-content-between align-items-center gap-2">
            <span class="fw-bold">
              <i class="bi bi-archive me-1 text-primary"></i>Histori Hasil TTD
            </span>
            <button type="button" class="btn btn-sm btn-outline-danger" onclick="clearStorageHistori()">
              <i class="bi bi-trash3 me-1"></i>Clear Storage
            </button>
          </div>
          <div class="card-body">

            <div class="row g-2 mb-3">
              <div class="col-12 col-md-5">
                <div class="input-group input-group-sm">
                  <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
                  <input type="text" class="form-control" id="searchHistori" placeholder="Cari nomor, pihak pertama, atau pihak kedua..." oninput="resetHalamanDanRender()" />
                </div>
              </div>

              <div class="col-6 col-md-4">
                <select class="form-select form-select-sm" id="filterKategori" onchange="resetHalamanDanRender()">
                  <option value="">Semua Kategori</option>
                  <option value="PO">PO</option>
                  <option value="Invoice">Invoice</option>
                  <option value="PKWT">Perjanjian Kerja</option>
                </select>
              </div>

              <div class="col-6 col-md-3">
                <select class="form-select form-select-sm" id="perPageSelect" onchange="resetHalamanDanRender()">
                  <option value="5" selected>5 / hal</option>
                  <option value="10">10 / hal</option>
                  <option value="20">20 / hal</option>
                </select>
              </div>
            </div>

            <div class="table-responsive">
              <table class="table table-hover align-middle mb-0">
                <thead class="table-light small">
                  <tr>
                    <th>Nomor Dokumen</th>
                    <th>Kategori</th>
                    <th>Pihak Pertama</th>
                    <th>Pihak Kedua</th>
                    <th>Tanggal</th>
                    <th class="text-end">Aksi</th>
                  </tr>
                </thead>
                <tbody id="tbodyHistori" class="small"></tbody>
              </table>
            </div>

            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mt-3 pt-2 border-top">
              <div class="text-muted small" id="infoPagination">Menampilkan 0 data</div>
              <nav aria-label="Navigasi halaman histori">
                <ul class="pagination pagination-sm mb-0" id="paginationList"></ul>
              </nav>
            </div>

          </div>
        </div>
      </div>

    </div>
  </main>

  <!-- Modal Detail Dokumen Tersimpan -->
  <div class="modal fade" id="modalDetailDok" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold" id="modalJudulDok">Detail Dokumen</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Tutup"></button>
        </div>
        <div class="modal-body" id="modalIsiDok"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-success btn-sm" onclick="bagikanModalAktif()">
            <i class="bi bi-share me-1"></i>Bagikan
          </button>
          <button type="button" class="btn btn-dark btn-sm" onclick="cetakDokumenModalAktif()">
            <i class="bi bi-printer me-1"></i>Print (1 Hal)
          </button>
          <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Tutup</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Container Cetak Khusus -->
  <div id="areaCetakKhusus"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const STORAGE_KEY = "esign_suite_arsip_v2";
    let halamanSaatIni = 1;
    let dokumenModalAktif = null;
    let arsipDokumen = muatDariStorage();

    function muatDariStorage() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        const parsed = raw ? JSON.parse(raw) : [];
        return Array.isArray(parsed) ? parsed : [];
      } catch (e) {
        return [];
      }
    }

    function simpanKeStorage() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(arsipDokumen));
    }

    function clearStorageHistori() {
      if (!arsipDokumen.length) {
        alert("Storage sudah kosong.");
        return;
      }
      if (confirm("Hapus seluruh data histori yang tersimpan di browser?")) {
        arsipDokumen = [];
        localStorage.removeItem(STORAGE_KEY);
        halamanSaatIni = 1;
        renderHistori();
      }
    }

    // ==================== NOMOR OTOMATIS (PO-tgl-bulan-tahun) ====================
    function buatNomorOtomatis(kategori) {
      const now = new Date();
      const tgl = String(now.getDate()).padStart(2, "0");
      const bln = String(now.getMonth() + 1).padStart(2, "0");
      const thn = now.getFullYear();
      const tanggalFormat = `${tgl}-${bln}-${thn}`;

      if (kategori === "PO") {
        return `PO-${tanggalFormat}`;
      }
      return `${kategori.toUpperCase()}-${tanggalFormat}`;
    }

    function perbaruiNomorTemplateOtomatis() {
      const jenis = document.getElementById("jenisTemplate").value;
      document.getElementById("tplNomor").value = buatNomorOtomatis(jenis);
    }

    function perbaruiNomorDokumenOtomatis() {
      const kat = document.getElementById("docKategori").value;
      document.getElementById("docNomor").value = buatNomorOtomatis(kat);
    }

    // ==================== DUA KANVAS TANDA TANGAN ====================
    const stateKanvas = {
      pihak1: {
        canvas: document.getElementById("canvasPihak1"),
        ctx: null,
        menggambar: false,
        adaGoresan: false
      },
      pihak2: {
        canvas: document.getElementById("canvasPihak2"),
        ctx: null,
        menggambar: false,
        adaGoresan: false
      }
    };

    stateKanvas.pihak1.ctx = stateKanvas.pihak1.canvas.getContext("2d");
    stateKanvas.pihak2.ctx = stateKanvas.pihak2.canvas.getContext("2d");

    function sesuaikanSemuaKanvas() {
      ["pihak1", "pihak2"].forEach((key) => {
        const st = stateKanvas[key];
        const rect = st.canvas.getBoundingClientRect();
        const tempImg = st.adaGoresan ? st.canvas.toDataURL("image/png") : null;
        st.canvas.width = rect.width || 300;
        st.canvas.height = 155;
        st.ctx.lineWidth = 2.5;
        st.ctx.lineCap = "round";
        st.ctx.strokeStyle = key === "pihak1" ? "#0d6efd" : "#198754";
        if (tempImg) {
          const img = new Image();
          img.onload = () => st.ctx.drawImage(img, 0, 0, st.canvas.width, st.canvas.height);
          img.src = tempImg;
        }
      });
    }

    function ambilKoordinat(canvas, evt) {
      const rect = canvas.getBoundingClientRect();
      const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
      const clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;
      return { x: clientX - rect.left, y: clientY - rect.top };
    }

    function pasangEventKanvas(key) {
      const st = stateKanvas[key];

      const mulai = (evt) => {
        evt.preventDefault();
        st.menggambar = true;
        st.adaGoresan = true;
        const pos = ambilKoordinat(st.canvas, evt);
        st.ctx.beginPath();
        st.ctx.moveTo(pos.x, pos.y);
      };

      const gerak = (evt) => {
        if (!st.menggambar) return;
        evt.preventDefault();
        const pos = ambilKoordinat(st.canvas, evt);
        st.ctx.lineTo(pos.x, pos.y);
        st.ctx.stroke();
      };

      const berhenti = () => {
        st.menggambar = false;
        st.ctx.closePath();
      };

      st.canvas.addEventListener("mousedown", mulai);
      st.canvas.addEventListener("mousemove", gerak);
      window.addEventListener("mouseup", berhenti);

      st.canvas.addEventListener("touchstart", mulai, { passive: false });
      st.canvas.addEventListener("touchmove", gerak, { passive: false });
      window.addEventListener("touchend", berhenti);
    }

    function bersihkanKanvas(key) {
      const st = stateKanvas[key];
      st.ctx.clearRect(0, 0, st.canvas.width, st.canvas.height);
      st.adaGoresan = false;
    }

    function resetTemplateKosong() {
      document.getElementById("jenisTemplate").value = "PO";
      document.getElementById("tplNomor").value = buatNomorOtomatis("PO");
      document.getElementById("tplPerusahaan").value = "";
      document.getElementById("tplPihakKedua").value = "";
      document.getElementById("tplDetail").value = "";
      document.getElementById("tplCatatan").value = "";
      renderTemplate();
    }

    function simpanDokumenTTD(event) {
      event.preventDefault();

      // Wajib kedua tanda tangan terisi
      if (!stateKanvas.pihak1.adaGoresan || !stateKanvas.pihak2.adaGoresan) {
        alert("Tanda tangan Pihak Pertama dan Pihak Kedua wajib diisi keduanya sebelum dokumen dapat disimpan ke histori.");
        return;
      }

      const kategori = document.getElementById("docKategori").value;
      const nomor = document.getElementById("docNomor").value.trim();
      const pihakPertama = document.getElementById("docPihakPertama").value.trim();
      const pihakKedua = document.getElementById("docPihakKedua").value.trim();
      const detail = document.getElementById("docDetail").value.trim() || "-";
      const catatan = document.getElementById("docCatatan").value.trim() || "-";

      const ttd1 = stateKanvas.pihak1.canvas.toDataURL("image/png");
      const ttd2 = stateKanvas.pihak2.canvas.toDataURL("image/png");
      const tanggal = new Date().toISOString().slice(0, 16).replace("T", " ");

      arsipDokumen.unshift({
        id: "ARC-" + Date.now().toString().slice(-6),
        nomor,
        kategori,
        pihakPertama,
        pihakKedua,
        detail,
        catatan,
        tanggal,
        ttd1,
        ttd2
      });

      simpanKeStorage();
      renderHistori();

      // Bersihkan form TTD & kembalikan ke halaman template kosong
      document.getElementById("formTTD").reset();
      bersihkanKanvas("pihak1");
      bersihkanKanvas("pihak2");
      resetTemplateKosong();

      const tabTemplate = new bootstrap.Tab(document.getElementById("tab-template-btn"));
      tabTemplate.show();
    }

    // ==================== TEMPLATE SURAT ====================
    function buatHTMLTemplate() {
      const jenis = document.getElementById("jenisTemplate").value;
      const nomor = document.getElementById("tplNomor").value.trim() || "-";
      const pihak1 = document.getElementById("tplPerusahaan").value.trim() || "-";
      const pihak2 = document.getElementById("tplPihakKedua").value.trim() || "-";
      const detail = document.getElementById("tplDetail").value.trim() || "-";
      const catatan = document.getElementById("tplCatatan").value.trim() || "-";

      let judulSurat = "PURCHASE ORDER (PO)";
      if (jenis === "Invoice") judulSurat = "INVOICE / TAGIHAN RESMI";
      if (jenis === "PKWT") judulSurat = "SURAT PERJANJIAN KERJA KARYAWAN";

      return `
        <div class="doc-paper">
          <div class="d-flex justify-content-between align-items-start border-bottom pb-2 mb-2">
            <div>
              <h6 class="fw-bold mb-0">${judulSurat}</h6>
              <small class="text-muted">Kategori: ${jenis}</small>
            </div>
            <span class="badge bg-secondary">${nomor}</span>
          </div>

          <div class="row g-2 mb-2 small">
            <div class="col-6">
              <div class="text-muted">Pihak Pertama:</div>
              <div class="fw-bold">${pihak1}</div>
            </div>
            <div class="col-6">
              <div class="text-muted">Pihak Kedua:</div>
              <div class="fw-bold">${pihak2}</div>
            </div>
          </div>

          <div class="mb-2 small">
            <div class="text-muted">Rincian Utama:</div>
            <div class="fw-bold">${detail}</div>
          </div>

          <p class="small mb-3" style="white-space: pre-line;">${catatan}</p>

          <div class="row g-2 pt-2 border-top small">
            <div class="col-6">
              <div class="text-muted mb-1">TTD Pihak Pertama:</div>
              <div class="sig-box-preview"><span class="text-muted small">Diisi pada Tab Buat &amp; TTD</span></div>
              <div class="fw-semibold mt-1">${pihak1}</div>
            </div>
            <div class="col-6">
              <div class="text-muted mb-1">TTD Pihak Kedua:</div>
              <div class="sig-box-preview"><span class="text-muted small">Diisi pada Tab Buat &amp; TTD</span></div>
              <div class="fw-semibold mt-1">${pihak2}</div>
            </div>
          </div>
        </div>
      `;
    }

    function renderTemplate() {
      document.getElementById("areaPreviewSurat").innerHTML = buatHTMLTemplate();
    }

    function panggilTemplateKeTTD() {
      const jenis = document.getElementById("jenisTemplate").value;
      const nomor = document.getElementById("tplNomor").value.trim() || buatNomorOtomatis(jenis);
      const pihak1 = document.getElementById("tplPerusahaan").value.trim();
      const pihak2 = document.getElementById("tplPihakKedua").value.trim();
      const detail = document.getElementById("tplDetail").value.trim();
      const catatan = document.getElementById("tplCatatan").value.trim();

      document.getElementById("docKategori").value = jenis;
      document.getElementById("docNomor").value = nomor;
      document.getElementById("docPihakPertama").value = pihak1;
      document.getElementById("docPihakKedua").value = pihak2;
      document.getElementById("docDetail").value = detail;
      document.getElementById("docCatatan").value = catatan;

      const tabTTD = new bootstrap.Tab(document.getElementById("tab-ttd-btn"));
      tabTTD.show();
      sesuaikanSemuaKanvas();
    }

    function bagikanTemplate() {
      const nomor = document.getElementById("tplNomor").value.trim() || "Dokumen";
      const pihak1 = document.getElementById("tplPerusahaan").value.trim() || "-";
      const pihak2 = document.getElementById("tplPihakKedua").value.trim() || "-";
      const teks = `Dokumen ${nomor} (${pihak1} & ${pihak2}).`;

      if (navigator.share) {
        navigator.share({ title: nomor, text: teks }).catch(() => {});
      } else {
        navigator.clipboard?.writeText(teks);
        alert("Info dokumen disalin:\n" + teks);
      }
    }

    // ==================== PRINT 1 HALAMAN SESUAI DOKUMEN TERPILIH ====================
    function cetakDokumenTerpilih(htmlDokumen) {
      const targetCetak = document.getElementById("areaCetakKhusus");
      targetCetak.innerHTML = htmlDokumen;
      window.print();
    }

    function buatHTMLDokumenArsip(dok) {
      return `
        <div class="doc-paper">
          <div class="d-flex justify-content-between align-items-start border-bottom pb-2 mb-2">
            <div>
              <h6 class="fw-bold mb-0">${dok.nomor}</h6>
              <small class="text-muted">Kategori: ${dok.kategori} &bull; Tanggal: ${dok.tanggal}</small>
            </div>
            <span class="badge bg-success">2 TTD Lengkap</span>
          </div>
          <div class="row g-2 mb-2 small">
            <div class="col-6"><strong>Pihak Pertama:</strong> ${dok.pihakPertama}</div>
            <div class="col-6"><strong>Pihak Kedua:</strong> ${dok.pihakKedua}</div>
          </div>
          <p class="small mb-1"><strong>Rincian:</strong> ${dok.detail}</p>
          <p class="small mb-3"><strong>Catatan:</strong> ${dok.catatan}</p>
          <div class="row g-2 pt-2 border-top small">
            <div class="col-6">
              <div class="text-muted mb-1">TTD Pihak Pertama:</div>
              <div class="sig-box-preview">
                <img src="${dok.ttd1}" alt="TTD Pihak Pertama" />
                <div class="small fw-semibold mt-1">${dok.pihakPertama}</div>
              </div>
            </div>
            <div class="col-6">
              <div class="text-muted mb-1">TTD Pihak Kedua:</div>
              <div class="sig-box-preview">
                <img src="${dok.ttd2}" alt="TTD Pihak Kedua" />
                <div class="small fw-semibold mt-1">${dok.pihakKedua}</div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // ==================== HISTORI (SEARCH, FILTER, PAGINATION) ====================
    function ambilDataTerfilter() {
      const kataKunci = document.getElementById("searchHistori").value.toLowerCase().trim();
      const kategori = document.getElementById("filterKategori").value;

      return arsipDokumen.filter((item) => {
        const cocokKata =
          !kataKunci ||
          item.nomor.toLowerCase().includes(kataKunci) ||
          item.pihakPertama.toLowerCase().includes(kataKunci) ||
          item.pihakKedua.toLowerCase().includes(kataKunci);
        const cocokKat = !kategori || item.kategori === kategori;
        return cocokKata && cocokKat;
      });
    }

    function resetHalamanDanRender() {
      halamanSaatIni = 1;
      renderHistori();
    }

    function renderHistori() {
      const hasil = ambilDataTerfilter();
      const perPage = parseInt(document.getElementById("perPageSelect").value, 10) || 5;
      const totalHalaman = Math.max(1, Math.ceil(hasil.length / perPage));
      if (halamanSaatIni > totalHalaman) halamanSaatIni = totalHalaman;

      const mulai = (halamanSaatIni - 1) * perPage;
      const potong = hasil.slice(mulai, mulai + perPage);

      const tbody = document.getElementById("tbodyHistori");
      if (potong.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="6" class="text-center text-muted py-4">
              Belum ada dokumen tersimpan atau tidak ada data yang sesuai filter.
            </td>
          </tr>
        `;
      } else {
        tbody.innerHTML = potong.map((dok) => `
          <tr>
            <td class="fw-bold">${dok.nomor}</td>
            <td><span class="badge bg-light text-dark border">${dok.kategori}</span></td>
            <td>${dok.pihakPertama}</td>
            <td>${dok.pihakKedua}</td>
            <td class="text-nowrap">${dok.tanggal}</td>
            <td class="text-end text-nowrap">
              <button class="btn btn-sm btn-outline-primary me-1" onclick="bukaModalDetail('${dok.id}')" title="Lihat">
                <i class="bi bi-eye"></i> Lihat
              </button>
              <button class="btn btn-sm btn-outline-dark" onclick="cetakById('${dok.id}')" title="Print 1 Halaman">
                <i class="bi bi-printer"></i>
              </button>
            </td>
          </tr>
        `).join("");
      }

      const info = document.getElementById("infoPagination");
      info.textContent = hasil.length === 0
        ? "Menampilkan 0 data"
        : `Menampilkan ${mulai + 1}–${Math.min(mulai + perPage, hasil.length)} dari ${hasil.length} dokumen (Hal ${halamanSaatIni}/${totalHalaman})`;

      const pagList = document.getElementById("paginationList");
      let htmlPag = `
        <li class="page-item ${halamanSaatIni === 1 ? "disabled" : ""}">
          <button class="page-link" onclick="pindahHalaman(${halamanSaatIni - 1})">&laquo;</button>
        </li>
      `;
      for (let i = 1; i <= totalHalaman; i++) {
        htmlPag += `
          <li class="page-item ${i === halamanSaatIni ? "active" : ""}">
            <button class="page-link" onclick="pindahHalaman(${i})">${i}</button>
          </li>
        `;
      }
      htmlPag += `
        <li class="page-item ${halamanSaatIni === totalHalaman ? "disabled" : ""}">
          <button class="page-link" onclick="pindahHalaman(${halamanSaatIni + 1})">&raquo;</button>
        </li>
      `;
      pagList.innerHTML = htmlPag;
    }

    function pindahHalaman(hal) {
      halamanSaatIni = hal;
      renderHistori();
    }

    function cetakById(idDok) {
      const dok = arsipDokumen.find((d) => d.id === idDok);
      if (!dok) return;
      cetakDokumenTerpilih(buatHTMLDokumenArsip(dok));
    }

    function bukaModalDetail(idDok) {
      const dok = arsipDokumen.find((d) => d.id === idDok);
      if (!dok) return;
      dokumenModalAktif = dok;

      document.getElementById("modalJudulDok").textContent = dok.nomor;
      document.getElementById("modalIsiDok").innerHTML = buatHTMLDokumenArsip(dok);

      const modal = new bootstrap.Modal(document.getElementById("modalDetailDok"));
      modal.show();
    }

    function cetakDokumenModalAktif() {
      if (!dokumenModalAktif) return;
      cetakDokumenTerpilih(buatHTMLDokumenArsip(dokumenModalAktif));
    }

    function bagikanModalAktif() {
      if (!dokumenModalAktif) return;
      const info = `Dokumen ${dokumenModalAktif.nomor} (${dokumenModalAktif.pihakPertama} & ${dokumenModalAktif.pihakKedua})`;
      if (navigator.share) {
        navigator.share({ title: dokumenModalAktif.nomor, text: info }).catch(() => {});
      } else {
        navigator.clipboard?.writeText(info);
        alert("Info dokumen disalin:\n" + info);
      }
    }

    // Inisialisasi awal
    pasangEventKanvas("pihak1");
    pasangEventKanvas("pihak2");
    window.addEventListener("resize", sesuaikanSemuaKanvas);
    document.getElementById("tab-ttd-btn").addEventListener("shown.bs.tab", sesuaikanSemuaKanvas);

    perbaruiNomorTemplateOtomatis();
    perbaruiNomorDokumenOtomatis();
    sesuaikanSemuaKanvas();
    renderTemplate();
    renderHistori();
  </script>
</body>
</html>
