            color: #333;

        }

        }

            background: #000;

        }

            border: 1px solid #ddd;
            outline: none;
        }

        .search-input:focus {
            border-color: #0d6efd;
        }

            left: 12px;
            top: 10px;

        }

            color: #084298;
            border-radius: 10px;
            padding: 8px 12px;

            }

};

let userManuallySelectedShift = false;
let lastAutoShift = null;

// ========================================
// TIME & SCHEDULE HELPERS (ASIA/JAKARTA)
// ========================================

function getJakartaParts(date = new Date()) {
    const formatter = new Intl.DateTimeFormat('en-CA', {
        timeZone: 'Asia/Jakarta',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: false
    });

    const parts = formatter.formatToParts(date);
    const map = {};
    parts.forEach(p => {
        if (p.type !== 'literal') map[p.type] = p.value;
    });

    return {
        year: Number(map.year),
        month: Number(map.month),
        day: Number(map.day),
        hour: Number(map.hour),
        minute: Number(map.minute),
        second: Number(map.second),
        dateKey: `${map.year}-${map.month}-${map.day}`
    };
}

function shiftDateKey(dateKey, deltaDays) {
    const [y, m, d] = dateKey.split('-').map(Number);
    const dt = new Date(Date.UTC(y, m - 1, d + deltaDays));
    const yy = dt.getUTCFullYear();
    const mm = String(dt.getUTCMonth() + 1).padStart(2, '0');
    const dd = String(dt.getUTCDate()).padStart(2, '0');
    return `${yy}-${mm}-${dd}`;
}

function getWorkMode() {
    const checked = document.querySelector('input[name="workMode"]:checked');
    return checked ? checked.value : 'daily';
}

function detectRecommendedShift(jakartaParts) {
    const mins = jakartaParts.hour * 60 + jakartaParts.minute;
    // 05:00 - 13:59 -> Shift Pagi
    if (mins >= 5 * 60 && mins < 14 * 60) return 'morning';
    // 14:00 - 21:59 -> Shift Siang
    if (mins >= 14 * 60 && mins < 22 * 60) return 'afternoon';
    // 22:00 - 04:59 -> Shift Malam
    return 'night';
}

function getActivePeriodKey(workMode, shiftId, jakartaParts) {
    if (workMode === 'daily') {
        return `daily:${jakartaParts.dateKey}`;
    }

    const shift = SHIFT_CONFIG[shiftId] || SHIFT_CONFIG.morning;
    if (shift.overnight && jakartaParts.hour < 12) {
        // Jam dini hari untuk shift malam milik tanggal mulai shift kemarin
        const startDate = shiftDateKey(jakartaParts.dateKey, -1);
        return `shift:${shift.id}:${startDate}`;
    }

    return `shift:${shift.id}:${jakartaParts.dateKey}`;
}

function evaluatePunctuality(tipe, workMode, shiftId, jakartaParts) {
    const currentMins = jakartaParts.hour * 60 + jakartaParts.minute;

    if (workMode === 'daily') {
        const startMins = DAILY_SCHEDULE.startHour * 60 + DAILY_SCHEDULE.startMinute;
        const endMins = DAILY_SCHEDULE.endHour * 60 + DAILY_SCHEDULE.endMinute;

        if (tipe === 'in') {
            return currentMins <= startMins ? uiLabels.on_time : uiLabels.late;
        } else {
            if (currentMins < endMins) return uiLabels.early_out;
            if (currentMins > endMins + 15) return uiLabels.overtime;
            return uiLabels.on_time;
        }
    }

    const shift = SHIFT_CONFIG[shiftId] || SHIFT_CONFIG.morning;
    const startMins = shift.startHour * 60 + shift.startMinute;
    let endMins = shift.endHour * 60 + shift.endMinute;
    let adjustedCurrent = currentMins;

    if (shift.overnight) {
        endMins += 24 * 60;
        if (currentMins < 12 * 60) {
            adjustedCurrent += 24 * 60;
        }
    }

    if (tipe === 'in') {
        return adjustedCurrent <= startMins ? uiLabels.on_time : uiLabels.late;
    } else {
        if (adjustedCurrent < endMins) return uiLabels.early_out;
        if (adjustedCurrent > endMins + 15) return uiLabels.overtime;
        return uiLabels.on_time;
    }
}

function updateShiftOptionLabels() {
    const select = document.getElementById('shiftSelect');
    Array.from(select.options).forEach(opt => {
        const cfg = SHIFT_CONFIG[opt.value];
        if (!cfg) return;
        const rangeText = cfg.overnight ? '22:00 - 06:00' :
            `${String(cfg.startHour).padStart(2, '0')}:00 - ${String(cfg.endHour).padStart(2, '0')}:00`;
        opt.textContent = `${cfg.labels[currentLang]} (${rangeText})`;
    });
}

function syncShiftWithCurrentTime() {
    const parts = getJakartaParts();
    const recommended = detectRecommendedShift(parts);

    if (recommended !== lastAutoShift) {
        lastAutoShift = recommended;
        if (!userManuallySelectedShift) {
            document.getElementById('shiftSelect').value = recommended;
        }
    }
}

function updateScheduleInfo() {
    const workMode = getWorkMode();
    const shiftId = document.getElementById('shiftSelect').value;
    const box = document.getElementById('scheduleInfo');
    const parts = getJakartaParts();
    const recommended = detectRecommendedShift(parts);
    const recLabel = SHIFT_CONFIG[recommended].labels[currentLang];

    if (workMode === 'daily') {
        box.innerHTML = `<i class="bi bi-clock me-1"></i> ${uiLabels.daily_desc}`;
    } else {
        const currentShiftLabel = SHIFT_CONFIG[shiftId].labels[currentLang];
        box.innerHTML = `
            <i class="bi bi-calendar2-check me-1"></i>
            <strong>${currentShiftLabel}</strong> — ${uiLabels.shift_auto_hint}: <strong>${recLabel}</strong>
        `;
    }
}


// ========================================
// CLOCK
// ========================================

function updateClock() {

    const now = new Date();

    document.getElementById('clock').innerText =
        now.toLocaleTimeString('id-ID', {
            hour12: false,
            timeZone: 'Asia/Jakarta'
        });

    document.getElementById('currentDate').innerText =
        now.toLocaleDateString(
            currentLang === 'zh' ? 'zh-CN' :
            currentLang === 'en' ? 'en-US' : 'id-ID',
            {
                weekday: 'long',
                day: '2-digit',
                month: 'short',
                year: 'numeric',
                timeZone: 'Asia/Jakarta'
            }
        ) + ' (Asia/Jakarta)';

    syncShiftWithCurrentTime();
    updateScheduleInfo();
}

updateClock();

        if (isShift && !userManuallySelectedShift) {
            document.getElementById('shiftSelect').value = detectRecommendedShift(getJakartaParts());
        }
        updateScheduleInfo();
        updateEmployeeQuotaInfo();
        checkReady();
    });
});

        },

        (err) => {

            document.getElementById('statusInfo').innerHTML = `
                <span class="text-danger">
                    ${uiLabels.gps_denied}
                </span>
            `;

        },

        {
            enableHighAccuracy: true,
            timeout: 15000,
            maximumAge: 0
        }

    );

}


// ========================================
// CAMERA
// ========================================

navigator.mediaDevices.getUserMedia({

    video: {
        facingMode: 'user'
    },

    audio: false

})

.then(stream => {

    video.srcObject = stream;

})

.catch(err => {

    console.error('Camera Error:', err);

    showNotif('Camera access failed!', 'danger');

});


// ========================================
// TAKE SNAPSHOT
// ========================================

function takeSnapshot() {

    if (!video.srcObject || video.readyState < 2) {

        showNotif('Camera is not ready!', 'danger');

        return;

    }

    const canvas = document.getElementById('canvas');

    const context = canvas.getContext('2d');

    context.save();

    context.translate(canvas.width, 0);

    context.scale(-1, 1);

    context.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
    );

    context.restore();

    selfieBase64 = canvas.toDataURL('image/jpeg', 0.8);

    showNotif('OK!', 'info');

    checkReady();

}


// ========================================
// ONCE-PER-PERIOD CHECK-IN / CHECK-OUT STATE
// ========================================

function getEmployeePeriodRecords(nama, periodKey) {
    const cleanName = nama.trim().toLowerCase();
    if (!cleanName) return { hasIn: false, hasOut: false };

    const listAbsensi = JSON.parse(localStorage.getItem('absensi_data')) || [];
    const matching = listAbsensi.filter(item =>
        (item.nama_karyawan || '').trim().toLowerCase() === cleanName &&
        item.period_key === periodKey
    );

    return {
        hasIn: matching.some(item => item.tipe_kode === 'in'),
        hasOut: matching.some(item => item.tipe_kode === 'out')
    };
}

function updateEmployeeQuotaInfo() {
    const nama = document.getElementById('namaKaryawan').value.trim();
    const infoEl = document.getElementById('employeeQuotaInfo');

    if (nama.length <= 2) {
        infoEl.textContent = '';
        return;
    }

    const workMode = getWorkMode();
    const shiftId = document.getElementById('shiftSelect').value;
    const periodKey = getActivePeriodKey(workMode, shiftId, getJakartaParts());
    const { hasIn, hasOut } = getEmployeePeriodRecords(nama, periodKey);

    if (hasIn && hasOut) {
        infoEl.className = 'small mt-1 fw-semibold text-secondary';
        infoEl.textContent = uiLabels.already_completed;
    } else if (hasIn) {
        infoEl.className = 'small mt-1 fw-semibold text-primary';
        infoEl.textContent = uiLabels.ready_out;
    } else {
        infoEl.className = 'small mt-1 fw-semibold text-success';
        infoEl.textContent = uiLabels.ready_in;
    }
}


// ========================================
// CHECK FORM READY
// ========================================

function checkReady() {

    const nama = document.getElementById('namaKaryawan').value.trim();

    const baseFormReady =
        nama.length > 2 &&
        selfieBase64 !== null &&
        userCoords.lat !== null &&
        userCoords.lng !== null;

    const workMode = getWorkMode();
    const shiftId = document.getElementById('shiftSelect').value;
    const periodKey = getActivePeriodKey(workMode, shiftId, getJakartaParts());
    const { hasIn, hasOut } = getEmployeePeriodRecords(nama, periodKey);

    // Masuk hanya 1 kali per periode
    const canIn = baseFormReady && !hasIn;

    // Pulang hanya 1 kali per periode dan setelah Masuk
    const canOut = baseFormReady && hasIn && !hasOut;

    document.getElementById('btnMasuk').disabled = !canIn;
    document.getElementById('btnPulang').disabled = !canOut;

}

document.getElementById('namaKaryawan').addEventListener('input', () => {
    updateEmployeeQuotaInfo();
    checkReady();
});


// ========================================
// SUBMIT ATTENDANCE
// ========================================

function submitAbsen(tipe) {

    const nama = document.getElementById('namaKaryawan').value.trim();

    if (
        nama.length <= 2 ||
        !selfieBase64 ||
        userCoords.lat === null ||
        userCoords.lng === null
    ) {
        showNotif('Please complete the attendance form!', 'danger');
        return;
    }

    const now = new Date();
    const jakartaParts = getJakartaParts(now);
    const workMode = getWorkMode();
    const shiftId = document.getElementById('shiftSelect').value;
    const periodKey = getActivePeriodKey(workMode, shiftId, jakartaParts);
    const { hasIn, hasOut } = getEmployeePeriodRecords(nama, periodKey);

    if (tipe === 'in' && hasIn) {
        showNotif(uiLabels.already_in, 'warning');
        checkReady();
        return;
    }

    if (tipe === 'out' && !hasIn) {
        showNotif(uiLabels.need_in_first, 'warning');
        checkReady();
        return;
    }

    if (tipe === 'out' && hasOut) {
        showNotif(uiLabels.already_completed, 'warning');
        checkReady();
        return;
    }

    const tipeLabel = uiLabels[tipe];
    const modeLabel = workMode === 'daily'
        ? uiLabels.daily_work
        : SHIFT_CONFIG[shiftId].labels[currentLang];

    const punctualityLabel = evaluatePunctuality(tipe, workMode, shiftId, jakartaParts);

    const dataBaru = {
        nama_karyawan: nama,
        tipe_kode: tipe,
        tipe_absen: tipeLabel,
        work_mode: workMode,
        shift_id: workMode === 'shift' ? shiftId : null,
        mode_label: modeLabel,
        punctuality_label: punctualityLabel,
        period_key: periodKey,
        waktu: now.toISOString(),
        lat: userCoords.lat,
        lng: userCoords.lng,
        foto: selfieBase64
    };

    let listAbsensi = JSON.parse(localStorage.getItem('absensi_data')) || [];

    listAbsensi.unshift(dataBaru);

    localStorage.setItem('absensi_data', JSON.stringify(listAbsensi));

    // RESET FORM
    selfieBase64 = null;
    document.getElementById('namaKaryawan').value = '';
    updateEmployeeQuotaInfo();
    checkReady();
    renderTable(document.getElementById('fuzzySearch').value);

    showNotif(
        `${uiLabels.success_msg}: ${tipeLabel} (${modeLabel} • ${punctualityLabel})`,
        'success'
    );

}


// ========================================
// RENDER ATTENDANCE TABLE
// ========================================

function renderTable(filter = '') {

    const tbody = document.getElementById('attendanceTableBody');

    const data = JSON.parse(localStorage.getItem('absensi_data')) || [];

    tbody.innerHTML = '';

    const filteredData = data.filter(item => {

        const haystack = [
            item.nama_karyawan,
            item.tipe_absen,
            item.mode_label,
            item.punctuality_label
        ].filter(Boolean).join(' ').toLowerCase();

        return haystack.includes(filter.toLowerCase());

    });


    if (filteredData.length === 0) {

        tbody.innerHTML = `
            <tr>
                <td colspan="4" class="text-center text-muted py-4">
                    ${uiLabels.no_data}
                </td>
            </tr>
        `;

        return;

    }


    filteredData.forEach(item => {

        const jam = new Date(item.waktu).toLocaleTimeString(
            currentLang === 'zh' ? 'zh-CN' :
            currentLang === 'en' ? 'en-US' : 'id-ID',
            {
                hour: '2-digit',
                minute: '2-digit',
                timeZone: 'Asia/Jakarta'
            }
        );

        const displayType = item.tipe_kode && uiLabels[item.tipe_kode]
            ? uiLabels[item.tipe_kode]
            : item.tipe_absen;

        const displayMode = item.work_mode === 'daily'
            ? uiLabels.daily_work
            : (item.shift_id && SHIFT_CONFIG[item.shift_id]
                ? SHIFT_CONFIG[item.shift_id].labels[currentLang]
                : (item.mode_label || ''));

        const tr = document.createElement('tr');
        tr.className = 'small border-bottom align-middle';

        const tdNama = document.createElement('td');

        const namaDiv = document.createElement('div');
        namaDiv.className = 'fw-bold';
        namaDiv.textContent = item.nama_karyawan;

        const badgeGroup = document.createElement('div');
        badgeGroup.className = 'd-flex flex-wrap gap-1 mt-1';

        const badgeType = document.createElement('span');
        badgeType.className = `badge ${item.tipe_kode === 'out' ? 'bg-danger' : 'bg-primary'} px-2`;
        badgeType.style.fontSize = '0.62rem';
        badgeType.textContent = displayType.toUpperCase();
        badgeGroup.appendChild(badgeType);

        if (displayMode) {
            const badgeMode = document.createElement('span');
            badgeMode.className = 'badge bg-secondary px-2';
            badgeMode.style.fontSize = '0.62rem';
            badgeMode.textContent = displayMode;
            badgeGroup.appendChild(badgeMode);
        }

        if (item.punctuality_label) {
            const badgeStatus = document.createElement('span');
            badgeStatus.className = 'badge bg-info text-dark px-2';
            badgeStatus.style.fontSize = '0.62rem';
            badgeStatus.textContent = item.punctuality_label;
            badgeGroup.appendChild(badgeStatus);
        }

        tdNama.appendChild(namaDiv);
        tdNama.appendChild(badgeGroup);

        const tdWaktu = document.createElement('td');
        tdWaktu.className = 'fw-bold';
        tdWaktu.textContent = jam;

        const tdMap = document.createElement('td');
        tdMap.className = 'text-center';

        const mapLink = document.createElement('a');
        mapLink.href = `https://www.google.com/maps?q=${item.lat},${item.lng}`;
        mapLink.target = '_blank';
        mapLink.rel = 'noopener noreferrer';
        mapLink.className = 'btn btn-sm btn-light border text-danger';
        mapLink.innerHTML = '<i class="bi bi-geo-alt-fill"></i>';

        tdMap.appendChild(mapLink);

        const tdFoto = document.createElement('td');
        tdFoto.className = 'text-end';

        const img = document.createElement('img');
        img.src = item.foto;
        img.alt = 'Attendance Photo';
        img.className = 'attendance-photo shadow-sm';

        tdFoto.appendChild(img);

        tr.appendChild(tdNama);
        tr.appendChild(tdWaktu);
        tr.appendChild(tdMap);
        tr.appendChild(tdFoto);

        tbody.appendChild(tr);

    });

}


// ========================================
// SEARCH
// ========================================

document.getElementById('fuzzySearch').addEventListener(
    'input',
    (e) => {

        renderTable(e.target.value);

    }
);


// ========================================
// CLEAR ALL DATA
// ========================================

function clearAllData() {

    if (confirm(uiLabels.confirm_clear)) {

        localStorage.removeItem('absensi_data');

        updateEmployeeQuotaInfo();
        checkReady();
        renderTable(document.getElementById('fuzzySearch').value);

    }

}


// ========================================
// NOTIFICATION
// ========================================

function showNotif(msg, type) {

    const container = document.getElementById('notifContainer');

    container.innerHTML = `
        <div class="alert alert-${type} py-2 small border-0 shadow-sm">
            ${msg}
        </div>
    `;

    setTimeout(() => {

        container.innerHTML = '';

    }, 3000);

}


// ========================================
// INITIALIZATION
// ========================================

syncShiftWithCurrentTime();
applyTranslations();
renderTable();

</script>
