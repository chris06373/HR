<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Payroll System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #fcfcfd;
            color: #1a1d23;
        }
        .card {
            border: 1px solid #f0f0f0;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02);
        }
        .form-control, .form-select {
            border-radius: 10px;
            padding: 12px;
            border: 1px solid #e2e8f0;
        }
        .form-control:focus, .form-select:focus {
            box-shadow: 0 0 0 4px rgba(78, 115, 223, 0.1);
            border-color: #4e73df;
        }
        .btn-save {
            background: #1a1d23;
            color: #ffffff;
            border-radius: 10px;
            padding: 12px;
            border: none;
            font-weight: 600;
        }
        .btn-save:hover {
            background: #333333;
            color: #ffffff;
        }
        .search-container {
            position: relative;
            max-width: 300px;
            width: 100%;
        }
        .search-container i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
        }
        .search-input {
            padding-left: 42px !important;
            background: #f8fafc !important;
            border: 1px solid #e2e8f0 !important;
        }
        .table-custom thead {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #64748b;
        }
        .badge-pos {
            font-weight: 500;
            padding: 6px 12px;
            border-radius: 8px;
        }
        #overtimeField {
            display: none;
        }
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
        }
    </style>
</head>
<body>

<div class="container-fluid px-4 py-4 py-md-5">
    <div class="row g-4">
        <!-- Header & Navigation -->
        <div class="col-12 d-flex flex-wrap justify-content-between align-items-center gap-3 mb-2 no-print">
            <div class="d-flex align-items-center gap-3">
                <a href="index.html" class="btn btn-light border rounded-3 d-inline-flex align-items-center gap-2" id="btn-home">
                    <i class="bi bi-arrow-left"></i>
                    <span id="t-home-btn">Home</span>
                </a>
                <div>
                    <h3 class="fw-bold mb-0" id="t-app-title">Payroll System</h3>
                    <span class="text-muted small" id="t-last-sync">Local Storage Active</span>
                </div>
            </div>

            <div class="d-flex align-items-center gap-2">
                <select class="form-select form-select-sm border bg-white w-auto" style="padding: 6px 28px 6px 12px;" onchange="changeLang(this.value)">
                    <option value="id">🇮🇩 Indonesia</option>
                    <option value="en" selected>🇺🇸 English</option>
                    <option value="cn">🇨🇳 Mandarin</option>
                </select>
                <button type="button" class="btn btn-outline-danger btn-sm rounded-3 d-inline-flex align-items-center gap-1" onclick="clearStorage()">
                    <i class="bi bi-trash3"></i>
                    <span id="t-clear-btn">Clear Storage</span>
                </button>
            </div>
        </div>

        <!-- Form Column -->
        <div class="col-lg-4 no-print">
            <div class="card p-4 sticky-top" style="top: 2rem;">
                <h5 class="fw-bold mb-4" id="t-form-title">Employee Data</h5>
                <form id="payForm">
                    <input type="hidden" id="editIdx" value="-1">
                    <input type="hidden" id="createdAt">

                    <div class="mb-3">
                        <label class="form-label small fw-semibold" id="l-name">Full Name</label>
                        <input type="text" id="name" class="form-control" placeholder="Enter name" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-semibold" id="l-pos">Position</label>
                        <select id="position" class="form-select" onchange="handlePositionChange()">
                            <option value="Staff">Staff</option>
                            <option value="Supervisor">Supervisor</option>
                            <option value="Manager">Manager</option>
                            <option value="General Manager">General Manager</option>
                            <option value="Director">Director</option>
                        </select>
                    </div>

                    <div id="overtimeField" class="mb-3">
                        <label class="form-label small fw-semibold" id="l-ot">Overtime (Hours)</label>
                        <input type="number" id="overtime" class="form-control" value="0" min="0" step="0.5">
                    </div>

                    <div class="mb-4">
                        <label class="form-label small fw-semibold" id="l-salary">Basic Salary</label>
                        <input type="number" id="salary" class="form-control" placeholder="0" min="0" required>
                    </div>

                    <button type="submit" class="btn btn-save w-100 mb-2" id="btn-submit">Add Record</button>
                    <button type="button" class="btn btn-light w-100 text-muted small" id="btn-reset" onclick="resetForm()">Reset</button>
                </form>
            </div>
        </div>

        <!-- Table Column -->
        <div class="col-lg-8 no-print">
            <div class="card p-0 overflow-hidden">
                <div class="p-4 d-flex flex-wrap justify-content-between align-items-center gap-3 border-bottom bg-white">
                    <h6 class="fw-bold mb-0" id="t-list-title">Payroll List</h6>
                    <div class="search-container">
                        <i class="bi bi-search"></i>
                        <input type="text" id="fuzzySearch" class="form-control search-input" placeholder="Quick search..." onkeyup="searchFuzzy()">
                    </div>
                </div>
                <div class="table-responsive">
                    <table class="table table-custom table-hover align-middle mb-0">
                        <thead class="bg-light">
                            <tr>
                                <th class="ps-4" id="th-emp">Employee</th>
                                <th id="th-pos">Position</th>
                                <th id="th-net">Net Salary</th>
                                <th class="text-end pe-4" id="th-act">Action</th>
                            </tr>
                        </thead>
                        <tbody id="tableData"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Detail Modal -->
<div class="modal fade" id="viewModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content rounded-4 border-0">
            <div class="modal-body p-4 text-center" id="viewContent"></div>
        </div>
    </div>
</div>

<!-- Print Slip Area -->
<div id="printArea" class="d-none print-only"></div>

<script src="https://cdn.jsdelivr.net/npm/fuse.js/dist/fuse.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const STORAGE_KEY = 'payroll_db';
    let db = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    let curLang = 'en';

    const trans = {
        en: {
            home: "Home",
            appTitle: "Payroll System",
            sync: "Local Storage Active",
            formTitle: "Employee Data",
            name: "Full Name",
            pos: "Position",
            salary: "Basic Salary",
            ot: "Overtime (Hours)",
            add: "Add Record",
            update: "Update Record",
            reset: "Reset",
            list: "Payroll List",
            search: "Quick search...",
            thEmp: "Employee",
            thPos: "Position",
            thNet: "Net Salary",
            thAct: "Action",
            clear: "Clear Storage",
            confirmClear: "Clear all payroll data from storage?",
            confirmDelete: "Delete this employee record?",
            empty: "No payroll records found."
        },
        id: {
            home: "Beranda",
            appTitle: "Sistem Payroll",
            sync: "Local Storage Aktif",
            formTitle: "Data Karyawan",
            name: "Nama Lengkap",
            pos: "Jabatan",
            salary: "Gaji Pokok",
            ot: "Lembur (Jam)",
            add: "Tambah Data",
            update: "Perbarui Data",
            reset: "Reset",
            list: "Daftar Gaji",
            search: "Cari cepat...",
            thEmp: "Karyawan",
            thPos: "Jabatan",
            thNet: "Gaji Bersih",
            thAct: "Aksi",
            clear: "Hapus Storage",
            confirmClear: "Hapus semua data gaji dari penyimpanan?",
            confirmDelete: "Hapus data karyawan ini?",
            empty: "Belum ada data gaji tersimpan."
        },
        cn: {
            home: "首页",
            appTitle: "薪资系统",
            sync: "本地存储已启用",
            formTitle: "员工数据",
            name: "姓名",
            pos: "职位",
            salary: "基本工资",
            ot: "加班时间（小时）",
            add: "添加记录",
            update: "更新记录",
            reset: "重置",
            list: "工资表",
            search: "快速搜索...",
            thEmp: "员工",
            thPos: "职位",
            thNet: "净工资",
            thAct: "操作",
            clear: "清除缓存",
            confirmClear: "确定要清除存储中的所有薪资数据吗？",
            confirmDelete: "确定要删除此员工记录吗？",
            empty: "暂无薪资记录。"
        }
    };

    const allowances = {
        "Staff": 0,
        "Supervisor": 1500000,
        "Manager": 3000000,
        "General Manager": 6000000,
        "Director": 12000000
    };

    function formatRupiah(num) {
        return "Rp " + Number(num || 0).toLocaleString('id-ID');
    }

    function handlePositionChange() {
        const pos = document.getElementById('position').value;
        const otField = document.getElementById('overtimeField');
        otField.style.display = (pos === 'Staff') ? 'block' : 'none';
        if (pos !== 'Staff') {
            document.getElementById('overtime').value = 0;
        }
    }

    function calculate(sal, pos, ot) {
        const allow = allowances[pos] || 0;
        const extra = (pos === 'Staff') ? (ot * 50000) : 0;
        const bpjs = sal * 0.02;
        const pph = (sal + allow + extra) * 0.05;
        const net = (sal + allow + extra) - (bpjs + pph);
        return { allow, extra, bpjs, pph, net };
    }

    document.getElementById('payForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const idx = parseInt(document.getElementById('editIdx').value, 10);
        const name = document.getElementById('name').value.trim();
        const pos = document.getElementById('position').value;
        const sal = parseFloat(document.getElementById('salary').value) || 0;
        const ot = (pos === 'Staff') ? (parseFloat(document.getElementById('overtime').value) || 0) : 0;
        const now = new Date().toLocaleString('id-ID');

        if (!name) return;

        const calc = calculate(sal, pos, ot);
        const entry = {
            name,
            pos,
            sal,
            ot,
            ...calc,
            createdAt: (idx === -1) ? now : (document.getElementById('createdAt').value || now),
            updatedAt: now
        };

        if (idx === -1) {
            db.push(entry);
        } else {
            db[idx] = entry;
        }

        save();
        resetForm();
    });

    function save() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
        searchFuzzy();
    }

    function render(rows) {
        const body = document.getElementById('tableData');
        body.innerHTML = '';

        if (!rows.length) {
            body.innerHTML = `
                <tr>
                    <td colspan="4" class="text-center text-muted py-5">${trans[curLang].empty}</td>
                </tr>`;
            return;
        }

        rows.forEach(({ item, realIndex }) => {
            body.innerHTML += `
                <tr>
                    <td class="ps-4">
                        <div class="fw-bold">${item.name}</div>
                        <div class="text-muted" style="font-size: 0.7rem">Updated: ${item.updatedAt}</div>
                    </td>
                    <td><span class="badge bg-light text-dark border badge-pos">${item.pos}</span></td>
                    <td class="fw-semibold">${formatRupiah(item.net)}</td>
                    <td class="text-end pe-4">
                        <div class="btn-group shadow-sm border rounded-3 overflow-hidden bg-white">
                            <button type="button" class="btn btn-white btn-sm px-2" onclick="view(${realIndex})" title="View"><i class="bi bi-eye"></i></button>
                            <button type="button" class="btn btn-white btn-sm px-2 border-start" onclick="edit(${realIndex})" title="Edit"><i class="bi bi-pencil"></i></button>
                            <button type="button" class="btn btn-white btn-sm px-2 border-start" onclick="printSlip(${realIndex})" title="Print"><i class="bi bi-printer"></i></button>
                            <button type="button" class="btn btn-white btn-sm px-2 border-start text-danger" onclick="deleteItem(${realIndex})" title="Delete"><i class="bi bi-trash"></i></button>
                        </div>
                    </td>
                </tr>`;
        });
    }

    function searchFuzzy() {
        const val = document.getElementById('fuzzySearch').value.trim();
        const indexedDb = db.map((item, realIndex) => ({ item, realIndex }));

        if (!val) {
            return render(indexedDb);
        }

        const fuse = new Fuse(indexedDb, {
            keys: ['item.name', 'item.pos'],
            threshold: 0.3
        });
        render(fuse.search(val).map(r => r.item));
    }

    function edit(i) {
        const item = db[i];
        if (!item) return;

        document.getElementById('editIdx').value = i;
        document.getElementById('name').value = item.name;
        document.getElementById('position').value = item.pos;
        document.getElementById('salary').value = item.sal;
        document.getElementById('overtime').value = item.ot;
        document.getElementById('createdAt').value = item.createdAt;
        document.getElementById('btn-submit').innerText = trans[curLang].update;
        handlePositionChange();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function deleteItem(i) {
        if (!confirm(trans[curLang].confirmDelete)) return;
        db.splice(i, 1);
        save();
        if (parseInt(document.getElementById('editIdx').value, 10) === i) {
            resetForm();
        }
    }

    function view(i) {
        const item = db[i];
        if (!item) return;

        document.getElementById('viewContent').innerHTML = `
            <div class="mb-3"><i class="bi bi-person-circle fs-1 text-primary"></i></div>
            <h4 class="fw-bold mb-1">${item.name}</h4>
            <p class="text-muted mb-4">${item.pos}</p>
            <div class="text-start small bg-light p-3 rounded-3">
                <div class="d-flex justify-content-between mb-2"><span>Basic Salary</span> <span>${formatRupiah(item.sal)}</span></div>
                <div class="d-flex justify-content-between mb-2"><span>Allowance</span> <span>${formatRupiah(item.allow)}</span></div>
                ${item.pos === 'Staff' ? `<div class="d-flex justify-content-between mb-2"><span>Overtime (${item.ot}h)</span> <span>${formatRupiah(item.extra)}</span></div>` : ''}
                <hr>
                <div class="d-flex justify-content-between text-danger mb-2"><span>BPJS TK (2%)</span> <span>- ${formatRupiah(item.bpjs)}</span></div>
                <div class="d-flex justify-content-between text-danger mb-2"><span>PPh21 (5%)</span> <span>- ${formatRupiah(item.pph)}</span></div>
                <hr>
                <div class="d-flex justify-content-between fw-bold fs-6"><span>Total Net</span> <span class="text-success">${formatRupiah(item.net)}</span></div>
            </div>
            <div class="mt-3 text-muted" style="font-size: 0.7rem">Created: ${item.createdAt}</div>
        `;
        new bootstrap.Modal('#viewModal').show();
    }

    function printSlip(i) {
        const item = db[i];
        if (!item) return;

        const area = document.getElementById('printArea');
        area.innerHTML = `
            <div style="padding: 40px; border: 1px solid #eee; font-family: sans-serif;">
                <h3 style="text-align: center; margin-top: 0;">PAYROLL SLIP</h3>
                <hr>
                <p><strong>Employee:</strong> ${item.name} (${item.pos})</p>
                <p><strong>Date:</strong> ${item.updatedAt}</p>
                <table width="100%" border="0" cellpadding="10" style="border-collapse: collapse;">
                    <tr><td>Basic Salary</td><td align="right">${formatRupiah(item.sal)}</td></tr>
                    <tr><td>Allowance</td><td align="right">${formatRupiah(item.allow)}</td></tr>
                    ${item.pos === 'Staff' ? `<tr><td>Overtime (${item.ot}h)</td><td align="right">${formatRupiah(item.extra)}</td></tr>` : ''}
                    <tr><td>Deductions (BPJS + PPh21)</td><td align="right">- ${formatRupiah(item.bpjs + item.pph)}</td></tr>
                    <tr style="background: #f9f9f9;"><td><strong>Total Net Pay</strong></td><td align="right"><strong>${formatRupiah(item.net)}</strong></td></tr>
                </table>
            </div>`;
        window.print();
    }

    function resetForm() {
        document.getElementById('payForm').reset();
        document.getElementById('editIdx').value = "-1";
        document.getElementById('createdAt').value = "";
        document.getElementById('btn-submit').innerText = trans[curLang].add;
        handlePositionChange();
    }

    function clearStorage() {
        if (confirm(trans[curLang].confirmClear)) {
            localStorage.removeItem(STORAGE_KEY);
            db = [];
            resetForm();
            render([]);
        }
    }

    function changeLang(l) {
        curLang = l;
        const d = trans[l];
        const isEditing = parseInt(document.getElementById('editIdx').value, 10) !== -1;

        document.getElementById('t-home-btn').innerText = d.home;
        document.getElementById('t-app-title').innerText = d.appTitle;
        document.getElementById('t-last-sync').innerText = d.sync;
        document.getElementById('t-form-title').innerText = d.formTitle;
        document.getElementById('l-name').innerText = d.name;
        document.getElementById('l-pos').innerText = d.pos;
        document.getElementById('l-salary').innerText = d.salary;
        document.getElementById('l-ot').innerText = d.ot;
        document.getElementById('btn-submit').innerText = isEditing ? d.update : d.add;
        document.getElementById('btn-reset').innerText = d.reset;
        document.getElementById('t-list-title').innerText = d.list;
        document.getElementById('fuzzySearch').placeholder = d.search;
        document.getElementById('th-emp').innerText = d.thEmp;
        document.getElementById('th-pos').innerText = d.thPos;
        document.getElementById('th-net').innerText = d.thNet;
        document.getElementById('th-act').innerText = d.thAct;
        document.getElementById('t-clear-btn').innerText = d.clear;

        searchFuzzy();
    }

    handlePositionChange();
    searchFuzzy();
</script>
</body>
</html>
